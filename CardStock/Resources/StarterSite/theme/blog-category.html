<article>
  <h1>{{ page.title }}</h1>
  {{#if page.content}}<div class="content intro">
{{{ page.content }}}
  </div>{{/if}}
</article>
<ul class="post-list">
  {{#each posts}}
  <li>
    <a href="{{ url }}">{{ title }}</a>
    <time datetime="{{ date }}">{{ dateDisplay }}</time>
    {{#if summary}}<p>{{ summary }}</p>{{/if}}
  </li>
  {{/each}}
</ul>
{{#if posts}}{{else}}<p class="empty">No posts in this category yet.</p>{{/if}}
