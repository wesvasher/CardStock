<h1>Shop</h1>
<div class="project-grid">
  {{#each products}}
  <a class="project-card" href="{{ url }}">
    {{#if cover}}<img src="{{ cover }}" alt="">{{/if}}
    <h2>{{ title }}</h2>
    {{#if price}}<p class="price">{{ price }}</p>{{/if}}
    {{#if summary}}<p>{{ summary }}</p>{{/if}}
  </a>
  {{/each}}
</div>
{{#if products}}{{else}}<p class="empty">Nothing for sale yet.</p>{{/if}}
