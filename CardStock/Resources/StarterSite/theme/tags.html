<article>
  <h1>{{ page.title }}</h1>
  {{#if tag}}<p class="meta">Tag · {{ tag.count }} · <a href="/tags/">All tags</a></p>
  {{#if tag.description}}<p class="intro">{{ tag.description }}</p>{{/if}}{{/if}}
</article>
{{#if tag}}{{{ listing }}}{{else}}<ul class="tag-cloud">
  {{#each tags}}<li><a href="{{ url }}">{{ name }}<small>{{ count }}</small></a></li>{{/each}}
</ul>
{{#if tags}}{{else}}<p class="empty">No tags yet.</p>{{/if}}{{/if}}
