name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build DMG
        run: DEVELOPER_DIR="$(xcode-select -p)" scripts/make-dmg.sh "${GITHUB_REF_NAME}"
      - name: Write release notes
        # The tagged commit's message, without the co-author line.
        run: |
          git log -1 --format=%B HEAD | grep -v '^Co-Authored-By:' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "CardStock ${GITHUB_REF_NAME}" --notes-file notes.md
